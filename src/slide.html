<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide</title>
    <script src="https://unpkg.com/embla-carousel/embla-carousel.umd.js"></script>
    <script src="https://unpkg.com/embla-carousel-autoplay/embla-carousel-autoplay.umd.js"></script>
</head>
<body>

    <style>
       .embla {
            overflow: hidden;
        }
        .embla__container {
            display: flex;
             gap: 1rem;
        }
        .embla__slide {
            flex: 0 0 50%;
            min-width: 0;
        }

        .c1{
            background-color: azure;
            text-align: center;
        }

    </style>

    <div class="embla">
        <div class="embla__container c1">
            <div class="embla__slide">Slide 1</div>
            <div class="embla__slide">Slide 2</div>
            <div class="embla__slide">Slide 3</div>
            <div class="embla__slide">Slide 4</div>
            <div class="embla__slide">Slide 5</div>
            <div class="embla__slide">Slide 6</div>
            <div class="embla__slide">Slide 7</div>
            <div class="embla__slide">Slide 8</div>
            <div class="embla__slide">Slide 9</div>
            <div class="embla__slide">Slide 10</div>
        </div>
    </div>

    <div class="embla__controls">
        <div class="embla__dots"></div>
    </div>

    <!-- <script type="text/javascript">
        const emblaNode = document.querySelector('.embla')
        const options = { loop: false }
        const emblaApi = EmblaCarousel(emblaNode, options)
        console.log(emblaApi.slideNodes()) // Access API
    </script> -->

    <script type="text/javascript">
        const emblaNode = document.querySelector('.embla');
        const dotsNode = document.querySelector('.embla__dots');

        // Inicializa o Embla Carousel
        const options = { loop: true };
        const emblaApi = EmblaCarousel(emblaNode, options);

        // Função para criar os pontos de navegação
        const setupDots = (emblaApi, dotsNode) => {
            let dots = [];

            const addToggleListener = (dot, index) => {
                dot.addEventListener('click', () => {
                    emblaApi.scrollTo(index);
                });
            };

            const toggleDotsClasses = (emblaApi) => {
                const previous = emblaApi.previousScrollSnap();
                const selected = emblaApi.selectedScrollSnap();
                dots[previous].classList.remove('embla__dot--selected');
                dots[selected].classList.add('embla__dot--selected');
            };

            emblaApi.on('init', () => {
                const scrollSnaps = emblaApi.scrollSnapList();

                dots = scrollSnaps.map((_, index) => {
                    const dot = document.createElement('button');
                    dot.classList.add('embla__dot');
                    dot.type = 'button';
                    dotsNode.appendChild(dot);
                    addToggleListener(dot, index);
                    return dot;
                });

                toggleDotsClasses(emblaApi);
            });

            emblaApi.on('select', toggleDotsClasses);
            emblaApi.on('reInit', toggleDotsClasses);
        };

        setupDots(emblaApi, dotsNode);
    </script>

</body>
</html>
